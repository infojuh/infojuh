name: profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

env:
  CARD: bg_color=0d0d0d&title_color=ffffff&text_color=c9c9c9&icon_color=34d399&ring_color=34d399&border_color=262626
  # Crie um PAT (classic, escopos: read:user + repo) e salve como secret GH_STATS_TOKEN
  # para contar commits de repositórios PRIVADOS. Sem ele, só o que é público entra.
  TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=infojuh&show_icons=true&include_all_commits=true&count_private=true&custom_title=GitHub%20Stats&${{ env.CARD }}
          path: profile/stats.svg
          token: ${{ env.TOKEN }}

      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=infojuh&layout=compact&langs_count=8&custom_title=Top%20Languages&${{ env.CARD }}
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}

      - name: Activity graph
        run: python3 scripts/activity.py profile/activity.svg
        env:
          GITHUB_TOKEN: ${{ env.TOKEN }}

      - name: Trophies
        run: python3 scripts/trophy.py profile/trophy.svg
        continue-on-error: true

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: infojuh
          github_token: ${{ env.TOKEN }}
          outputs: |
            profile/snake-light.svg?color_snake=#059669&color_dots=#ebedf0,#a7f3d0,#6ee7b7,#10b981,#047857
            profile/snake-dark.svg?palette=github-dark&color_snake=#34d399&color_dots=#161616,#064e3b,#047857,#10b981,#34d399

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile cards"
          git push
